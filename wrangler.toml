# Cloudflare Workers configuration for AASRA
# https://developers.cloudflare.com/workers/wrangler/configuration/

# Must match the Git-connected Worker name in the Cloudflare dashboard
name = "aasra"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets — built by `npm run build` (astro build -> dist/).
# ASSETS binding is used by the compiled functions router for non-API routes.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# CRITICAL: /api/* must always execute the Worker script. Without this, the
# asset layer intercepts requests before the Worker runs and serves the static
# 404 page for every API route in production. Keep this line.
run_worker_first = ["/api/*"]

# --- Non-secret environment variables (safe to commit) ---
[vars]
PUBLIC_BASE_URL = "https://aasra.shop"
# Comma-separated list of origins allowed to call the API (CORS + origin check).
# The workers.dev preview host is included so the store can be tested before
# the custom domain is active. Remove it once aasra.shop is live if you like.
ALLOWED_ORIGIN = "https://aasra.shop,https://www.aasra.shop,https://aasra.shanzeeey.workers.dev"
DEFAULT_DEPOSIT_PERCENT = "30"
BALANCE_REMINDER_DAYS = "3,1"
BALANCE_CANCEL_AFTER_DAYS = "7"
TAX_RATE_PCT = "0"                                  # VERIFY: actual sales tax rule
BUSINESS_NAME = "AASRA"
BUSINESS_ADDRESS = ""                               # Set the legal business address before accepting orders
BUSINESS_EMAIL = "orders@aasra.shop"
TAX_REGISTRATION_NO = ""                            # Set verified tax registration details before issuing receipts
# EMAIL_PROVIDER = "resend"                         # Only set after provider implementation + credentials are ready
EMAIL_FROM = "orders@aasra.shop"
EMAIL_FROM_NAME = "AASRA"
SAFEPAY_ENABLED = "true"                            # Hosted checkout; degrades to 503 if Safepay keys are absent
SAFEPAY_PROTOCOL_VERIFIED = "true"                  # Contract verified against Safepay's official SDK (getsafepay/safepay-python)
SAFEPAY_BASE_URL = "https://sandbox.api.getsafepay.com"   # sandbox — switch to https://api.getsafepay.com for live
SAFEPAY_CHECKOUT_URL = "https://sandbox.api.getsafepay.com"   # sandbox serves API + checkout from one host; live = https://getsafepay.com
SAFEPAY_API_KEY = "sec_74e393e2-ca7f-4cb6-9229-7ba73eddd29b"   # public key (sec_...) — safe as a var; rotate with the secret key
# Required secrets: SAFEPAY_SECRET_KEY, TURNSTILE_SECRET_KEY
# Optional secrets: SAFEPAY_WEBHOOK_SECRET (webhook verification), SAFEPAY_V1_SECRET
# Required public variable: TURNSTILE_SITE_KEY
PAYFAST_ENABLED = "false"

# --- Secrets (set via dashboard > Settings > Variables and Secrets, or
#     `npx wrangler secret put NAME`; NEVER commit these) ---
#   TURNSTILE_SECRET_KEY
#   SAFEPAY_SECRET_KEY
#   SAFEPAY_WEBHOOK_SECRET
#   EMAIL_PROVIDER_API_KEY

# --- D1 database binding ---
# Create the database first (dashboard: Storage & Databases > D1 > "AASRA_DB",
# or `npx wrangler d1 create AASRA_DB`), then UNCOMMENT this block and paste
# the database_id. Deploys fail if this block is active with a placeholder.
# [[d1_databases]]
# binding = "DB"
# database_name = "AASRA_DB"
# database_id = "<PASTE-DATABASE-ID>"

# Cron triggers — daily 09:00 UTC: balance reminders, reservation expiry,
# unpaid-order cancellation, gateway reconciliation (functions/scheduled.js)
[triggers]
crons = ["0 9 * * *"]

# WAF rate limiting rules for /api/* endpoints
# Applied via Cloudflare dashboard > Security > WAF > Rate limiting rules
# (These are documented here; create them in the dashboard or via the Cloudflare API)
# - POST /api/checkout: 10 requests per minute per IP
# - POST /api/pay-balance: 5 requests per minute per IP
# - POST /api/contact: 5 requests per minute per IP
# - POST /api/newsletter: 5 requests per minute per IP
# - GET /api/order-lookup: 10 requests per minute per IP
# - GET /api/invoice: 10 requests per minute per IP
# - POST /api/webhook: 60 requests per minute per IP (gateway webhooks)
